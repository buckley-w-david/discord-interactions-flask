[project]
name = "discord-interactions-flask"
version = "0.3.0"
description = ""
authors = [{ name = "David Buckley", email = "david@davidbuckley.ca" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "Flask>=3.1.3,<4",
  "jsons>=1.6,<2",
  "urllib3>=2.8,<3",
  "PyNaCl>=1.5,<2",
]

[project.urls]
Homepage = "https://github.com/buckley-w-david/discord-interactions-flask"
Repository = "https://github.com/buckley-w-david/discord-interactions-flask"

[dependency-groups]
dev = [
  "pytest>=7.1,<8",
  "black>=22.10,<23",
  "pydocstyle>=6.1,<7",
  "Sphinx>=5.3,<6",
  "sphinx-rtd-theme>=1.1,<2",
  "pyright>=1.1,<2",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
